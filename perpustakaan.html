<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibSchool - Perpustakaan Sekolah</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { background-color: #f8f9fa; }
.book-card { margin-bottom: 20px; }
.navbar { background-color: #007bff; }
.navbar-brand, .nav-link { color: white !important; }
.book-title { cursor: pointer; color: #007bff; }
.book-title:hover { text-decoration: underline; }
.chart-wrapper {
    max-width: 360px;   /* ubah ke 350–500 sesuai selera */
    margin: 0 auto;     /* posisi tengah */
}
.admin-action {
    position: absolute;
    top: 70px;          /* tepat di bawah navbar */
    right: 120px;
    z-index: 1000;
}

@media (max-width: 768px) {
    .admin-action {
        position: static;
        margin-bottom: 10px;
        text-align: right;
    }
}
</style>
</head>

<body>
<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand">Giri Widya LibSchool</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="index.html"><i class="bi bi-book fs-4"></i></a>
</div>
</div>
</nav>

<div class="container mt-4">
<h2>Daftar Buku Tersedia</h2>

<div class="admin-action">
    <button class="btn btn-primary btn-sm" onclick="adminLogin()">
        <i class="bi bi-person-lock"></i> Login Admin
    </button>

    <button class="btn btn-danger btn-sm d-none" id="btnLogout" onclick="adminLogout()">
        <i class="bi bi-box-arrow-right"></i> Logout
    </button>
</div>

<button class="btn btn-success mb-2 d-none" id="btnTambahBuku" onclick="showAddBookForm()">Tambah Buku</button>
<button class="btn btn-outline-success mb-2 d-none" id="btnExportExcel" onclick="exportToExcel()">Download Excel</button>

<input type="text" id="search" class="form-control my-3" placeholder="Cari judul / penulis" onkeyup="searchBooks()">

<div class="row mt-4">

    <!-- DAFTAR BUKU -->
    <div class="col-md-8">
      <div class="row" id="bookList"></div>
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </div>
  
    <!-- DIAGRAM -->
    <div class="col-md-4">
      <div class="chart-wrapper">
        <canvas id="bookChart"></canvas>
      </div>
    </div>
  
  </div>
  

<!-- MODAL TAMBAH BUKU -->
<div class="modal fade" id="addBookModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Tambah Buku</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<form id="addBookForm">
<input class="form-control mb-2" id="newTitle" placeholder="Judul" required>
<input class="form-control mb-2" id="newAuthor" placeholder="Penulis" required>
<input class="form-control mb-2" type="number" id="newYear" placeholder="Tahun" required>
<input class="form-control mb-2" type="number" id="newPages" placeholder="Halaman" required>
<select class="form-control mb-3" id="newType" required>
<option value="">Pilih Jenis</option>
<option>Buku Pelajaran</option>
<option>Buku Cerita</option>
<option>Majalah</option>
<option>Koran</option>
</select>
<button class="btn btn-primary w-100">Simpan</button>
</form>
</div>
</div>
</div>
</div>

<!-- MODAL DETAIL BUKU -->
<div class="modal fade" id="detailBookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detail Buku</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Judul:</strong> <span id="detailTitle"></span></p>
          <p><strong>Penulis:</strong> <span id="detailAuthor"></span></p>
          <p><strong>Tahun Terbit:</strong> <span id="detailYear"></span></p>
          <p><strong>Jenis Buku:</strong> <span id="detailType"></span></p>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ================= ADMIN CONFIG ================= */
const ADMIN_USERNAME = "50100236";
const ADMIN_PASSWORD = "50100236";

/* ================= DATA BUKU ================= */
let books = JSON.parse(localStorage.getItem("books")) || [
{ id:1,title:"Harry Potter",author:"J.K Rowling",year:1997,pages:300,type:"Buku Cerita" }
];
let filteredBooks = books;
let currentPage = 1;
const perPage = 30;

let chartInstance = null;

/* ================= LOGIN ================= */
function adminLogin(){
const u = prompt("Username:");
const p = prompt("Password:");
if(u===ADMIN_USERNAME && p===ADMIN_PASSWORD){
localStorage.setItem("isAdmin","true");
alert("Login berhasil");
cekStatusAdmin();
}else alert("Login gagal");
}
function adminLogout(){
localStorage.removeItem("isAdmin");
cekStatusAdmin();
}
function cekStatusAdmin(){
    const a = localStorage.getItem("isAdmin")==="true";

    ["btnTambahBuku","btnLogout","btnExportExcel"].forEach(id=>{
        document.getElementById(id).classList.toggle("d-none", !a);
    });

    renderBooks(); // 🔴 INI KUNCINYA

    document.querySelector("button[onclick='adminLogin()']")
    .classList.toggle("d-none", a);
}
cekStatusAdmin();

/* ================= TAMBAH BUKU ================= */
function showAddBookForm(){
if(localStorage.getItem("isAdmin")!=="true") return;
new bootstrap.Modal(document.getElementById("addBookModal")).show();
}

document.getElementById("addBookForm").addEventListener("submit",e=>{
e.preventDefault();
if(localStorage.getItem("isAdmin")!=="true") return;

const isDuplicate = books.some(b =>
    b.title.toLowerCase() === newTitle.value.toLowerCase() &&
    b.author.toLowerCase() === newAuthor.value.toLowerCase()
);

if(isDuplicate){
    alert("Buku sudah ada!");
    return;
}

books.unshift({
    id: Date.now(),
    title: newTitle.value,
    author: newAuthor.value,
    year: +newYear.value,
    pages: +newPages.value,
    type: newType.value
});
localStorage.setItem("books",JSON.stringify(books));
filteredBooks=books;
currentPage=1;
renderBooks();
renderChart();
bootstrap.Modal.getInstance(addBookModal).hide();
e.target.reset();
});

/* ================= TAMPIL BUKU ================= */
function renderBooks(){
    bookList.innerHTML="";

    filteredBooks
    .slice((currentPage-1)*perPage, currentPage*perPage)
    .forEach(b=>{
        bookList.innerHTML+=`
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="book-title" onclick="showBookDetail(${b.id})">
                        ${b.title}
                    </h5>
                    <p>${b.author} (${b.year})</p>
                    
                    ${localStorage.getItem("isAdmin")==="true" ? `
                    <button class="btn btn-sm btn-outline-danger mt-2"
                            onclick="deleteBook(${b.id})">
                        <i class="bi bi-trash"></i> Hapus
                    </button>` : ""}
                </div>
            </div>
        </div>`;
    });

    renderPagination(); // 🔴 PENTING
}

renderBooks();


function renderChart() {
    const countByType = {};

    books.forEach(b => {
        countByType[b.type] = (countByType[b.type] || 0) + 1;
    });

    const labels = Object.keys(countByType);
    const data = Object.values(countByType);

    const ctx = document.getElementById("bookChart").getContext("2d");

    if (chartInstance) {
        chartInstance.destroy(); // supaya realtime
    }

    chartInstance = new Chart(ctx, {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: data
            }]
        },
        options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: {
            position: "bottom"
        }
    }
}
    });
}
renderChart();

function showBookDetail(bookId) {
    const book = books.find(b => b.id === bookId);
    if (!book) return;

    document.getElementById("detailTitle").innerText = book.title;
    document.getElementById("detailAuthor").innerText = book.author;
    document.getElementById("detailYear").innerText = book.year;
    document.getElementById("detailType").innerText = book.type;

    const modal = new bootstrap.Modal(
        document.getElementById("detailBookModal")
    );
    modal.show();
}

function renderPagination(){
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    const totalPages = Math.ceil(filteredBooks.length / perPage);
    if (totalPages <= 1) return;

    // PREV
    const prev = document.createElement("li");
    prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
    prev.innerHTML = `<a class="page-link">Prev</a>`;
    prev.onclick = () => {
        if(currentPage > 1){
            currentPage--;
            renderBooks();
            renderPagination();
        }
    };
    pagination.appendChild(prev);

    // INFO HALAMAN
    const info = document.createElement("li");
    info.className = "page-item disabled";
    info.innerHTML = `<a class="page-link">Halaman ${currentPage} / ${totalPages}</a>`;
    pagination.appendChild(info);

    // NEXT
    const next = document.createElement("li");
    next.className = `page-item ${currentPage === totalPages ? "disabled" : ""}`;
    next.innerHTML = `<a class="page-link">Next</a>`;
    next.onclick = () => {
        if(currentPage < totalPages){
            currentPage++;
            renderBooks();
            renderPagination();
        }
    };
    pagination.appendChild(next);
}


/* ================= SEARCH ================= */
function searchBooks(){
    const q = search.value.toLowerCase();
    filteredBooks = books.filter(b =>
        b.title.toLowerCase().includes(q) ||
        b.author.toLowerCase().includes(q)
    );
    currentPage = 1;
    renderBooks();
}

/* ================= EXPORT EXCEL ================= */
function exportToExcel(){
if(localStorage.getItem("isAdmin")!=="true") return;
const data = books.map((b,i)=>({
No:i+1,Judul:b.title,Penulis:b.author,Tahun:b.year,Halaman:b.pages,Jenis:b.type
}));
const ws=XLSX.utils.json_to_sheet(data);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Buku");
XLSX.writeFile(wb,"Data_Buku_Perpustakaan.xlsx");
}

/* ================= HAPUS BUKU ================= */
function deleteBook(bookId){
    if(localStorage.getItem("isAdmin")!=="true") return;

    const book = books.find(b => b.id === bookId);
    if(!book) return;

    if(!confirm(`Hapus buku "${book.title}"?`)) return;

    // hapus dari array
    books = books.filter(b => b.id !== bookId);
    filteredBooks = filteredBooks.filter(b => b.id !== bookId);

    // simpan ulang
    localStorage.setItem("books", JSON.stringify(books));

    // perbaiki halaman kosong
    const totalPages = Math.ceil(filteredBooks.length / perPage);
    if(currentPage > totalPages) currentPage = totalPages || 1;

    renderBooks();
    renderChart();
}

</script>
</body>
</html>
