<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibSchool - Perpustakaan Sekolah</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { background-color: #f8f9fa; }
.book-card { margin-bottom: 20px; }
.navbar { background-color: #007bff; }
.navbar-brand, .nav-link { color: white !important; }
.book-title { cursor: pointer; color: #007bff; }
.book-title:hover { text-decoration: underline; }
.chart-wrapper {
    max-width: 360px;   /* ubah ke 350–500 sesuai selera */
    height: 300px;
    margin: 0 auto;     /* posisi tengah */
}
.admin-action {
    position: absolute;
    top: 70px;          /* tepat di bawah navbar */
    right: 120px;
    z-index: 1000;
}

@media (max-width: 768px) {
    .admin-action {
        position: static;
        margin-bottom: 10px;
        text-align: right;
    }
}
</style>
</head>

<body>
<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand">Giri Widya LibSchool</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="index.html"><i class="bi bi-book fs-4"></i></a>
</div>
</div>
</nav>

<div class="container mt-4">
<h2>Daftar Buku Tersedia</h2>

<button class="btn btn-success mb-2 d-none" id="btnTambahBuku" onclick="showAddBookForm()">Tambah Buku</button>
<button class="btn btn-outline-success mb-2 d-none" id="btnExportExcel" onclick="exportToExcel()">Download Excel</button>

<input type="text" id="search" class="form-control my-3" placeholder="Cari judul / penulis" onkeyup="searchBooks()">
<div class="row mb-3">
    <div class="col-md-6">
      <select id="filterType" class="form-select" onchange="filterBooks()">
        <option value="">Semua Jenis Buku</option>
      </select>
    </div>
  
    <div class="col-md-6">
      <select id="filterYear" class="form-select" onchange="filterBooks()">
        <option value="">Semua Tahun Terbit</option>
      </select>
    </div>
  </div>
  

<div class="row mt-4">

    <!-- DAFTAR BUKU -->
    <div class="col-md-8">
      <div class="row" id="bookList"></div>
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </div>
  
    <!-- DIAGRAM -->
    <div class="col-md-4">
      <div class="chart-wrapper">
        <canvas id="bookChart"></canvas>
      </div>
    </div>
  
  </div>

<!-- MODAL DETAIL BUKU -->
<div class="modal fade" id="detailBookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detail Buku</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Judul:</strong> <span id="detailTitle"></span></p>
          <p><strong>Penulis:</strong> <span id="detailAuthor"></span></p>
          <p><strong>Tahun Terbit:</strong> <span id="detailYear"></span></p>
          <p><strong>Jenis Buku:</strong> <span id="detailType"></span></p>
          <p><strong>Kode Buku:</strong> <span id="detailCodebooks"></span></p>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbzLo2EX0ASnfVWn4vNA2OhVrcD00TK-Cu3wZgL6oRm3o5nJFAYxujKr9UxCDmoS8fCv9g/exec";

let books = [];
let filteredBooks = [];
let currentPage = 1;
const perPage = 30;
let chartInstance = null;

/* 🔥 AMBIL DATA DARI GOOGLE SHEET */
async function loadBooks(){
  const res = await fetch(SHEET_API);
  books = await res.json();
  books.sort((a,b) => b.id - a.id);
  filteredBooks = books;
  initFilters();
  renderBooks();
  renderChart();
}

loadBooks();
setInterval(loadBooks, 60000); // refresh tiap 60 detik

function filterBooks() {
    const keyword = search.value.toLowerCase();
    const type = filterType.value;
    const year = filterYear.value;

    filteredBooks = books.filter(b => {
        return (
            (b.title.toLowerCase().includes(keyword) ||
             b.author.toLowerCase().includes(keyword)) &&
            (type === "" || b.type === type) &&
            (year === "" || b.year == year)
        );
    });

    currentPage = 1;
    renderBooks();
}


/* ================= TAMPIL BUKU ================= */
function renderBooks(){
    bookList.innerHTML="";

    filteredBooks
    .slice((currentPage-1)*perPage, currentPage*perPage)
    .forEach(b=>{
        bookList.innerHTML+=`
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="book-title" onclick="showBookDetail(${b.id})">
                        ${b.title}
                    </h5>
                    <p>${b.author} (${b.year})</p>
                    
                    ${localStorage.getItem("isAdmin")==="true" ? `
                    <button class="btn btn-sm btn-outline-danger mt-2"
                            onclick="deleteBook(${b.id})">
                        <i class="bi bi-trash"></i> Hapus
                    </button>` : ""}
                </div>
            </div>
        </div>`;
    });

    renderPagination(); // 🔴 PENTING
}

function renderChart() {
    if (!books.length) return;

    const countByType = {};

    books.forEach(b => {
        countByType[b.type] = (countByType[b.type] || 0) + 1;
    });

    const labels = Object.keys(countByType);
    const data = Object.values(countByType);

    const ctx = document.getElementById("bookChart").getContext("2d");

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: data
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: "bottom"
                }
            }
        }
    });
}


function showBookDetail(bookId) {
    const book = books.find(b => b.id === bookId);
    if (!book) return;

    document.getElementById("detailTitle").innerText = book.title;
    document.getElementById("detailAuthor").innerText = book.author;
    document.getElementById("detailYear").innerText = book.year;
    document.getElementById("detailType").innerText = book.type;
    document.getElementById("detailCodebooks").innerText = book.codebooks;

    const modal = new bootstrap.Modal(
        document.getElementById("detailBookModal")
    );
    modal.show();
}

function renderPagination(){
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    const totalPages = Math.ceil(filteredBooks.length / perPage);
    if (totalPages <= 1) return;

    // PREV
    const prev = document.createElement("li");
    prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
    prev.innerHTML = `<a class="page-link">Prev</a>`;
    prev.onclick = () => {
        if(currentPage > 1){
            currentPage--;
            renderBooks();
            renderPagination();
        }
    };
    pagination.appendChild(prev);

    // INFO HALAMAN
    const info = document.createElement("li");
    info.className = "page-item disabled";
    info.innerHTML = `<a class="page-link">Halaman ${currentPage} / ${totalPages}</a>`;
    pagination.appendChild(info);

    // NEXT
    const next = document.createElement("li");
    next.className = `page-item ${currentPage === totalPages ? "disabled" : ""}`;
    next.innerHTML = `<a class="page-link">Next</a>`;
    next.onclick = () => {
        if(currentPage < totalPages){
            currentPage++;
            renderBooks();
            renderPagination();
        }
    };
    pagination.appendChild(next);
}


/* ================= SEARCH ================= */
function searchBooks(){
    filterBooks();
}

/* ================= FILTER BUKU ================= */
function initFilters() {
    const typeSelect = document.getElementById("filterType");
    const yearSelect = document.getElementById("filterYear");

    const types = [...new Set(books.map(b => b.type))];
    const years = [...new Set(books.map(b => b.year))].sort((a,b)=>b-a);

    typeSelect.innerHTML = '<option value="">Semua Jenis Buku</option>';
    yearSelect.innerHTML = '<option value="">Semua Tahun Terbit</option>';

    types.forEach(t => {
        typeSelect.innerHTML += `<option value="${t}">${t}</option>`;
    });

    years.forEach(y => {
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
    });
}


</script>
</body>
</html>
