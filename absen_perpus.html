<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Absensi Perpustakaan</title>

  <!-- Library Scan Barcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }
  
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }
  
    h2 {
      margin: 10px 0 5px;
    }
  
    p {
      margin: 0 0 10px;
      font-size: 14px;
    }
  
    #reader {
      width: 100vw;
      height: 70vh;
    }
  
    #status {
      height: 20vh;
      font-size: 22px;
      font-weight: bold;
      padding: 10px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  
</head>
<body>

<h2>Absensi Pengunjung Perpustakaan</h2>
<p>Silakan arahkan kamera ke barcode kartu siswa</p>

<!-- Area Kamera -->
<div id="reader"></div>

<!-- Status -->
<div id="status">Menunggu scan...</div>

<script>
  let sedangProses = false;
  const statusEl = document.getElementById("status");

  function bunyiBeep() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); // nada beep
  gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.2);
}


  function kirimData(idSiswa) {
    fetch("https://script.google.com/macros/s/AKfycbyywj4Ugc3AoHHNwestbo9PurbjqN7lvvlRicA0-lHIhWssuP9LGyIXG3KMdNnSwMAwlQ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "id=" + encodeURIComponent(idSiswa)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "ok") {
  bunyiBeep(); // 🔊 BEEP
  statusEl.innerHTML =
    "✅ Selamat datang<br>" +
    data.nama + " (" + data.kelas + ")";
}
 
  else if (data.status === "duplicate") {
    statusEl.innerHTML =
      "⚠️ Sudah absen hari ini<br>" +
      data.nama + " (" + data.kelas + ")";
  } 
  else {
    statusEl.innerHTML = "❌ Data siswa tidak ditemukan";
  }
});

  }

  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 300, height: 300 }
    },
    (decodedText) => {
      if (sedangProses) return; // kunci scan
      sedangProses = true;

      kirimData(decodedText);

      // buka scan lagi setelah 3 detik TANPA mematikan kamera
      setTimeout(() => {
        statusEl.innerHTML = "Menunggu scan...";
        sedangProses = false;
      }, 6000);
    }
  );
</script>

</body>
</html>
