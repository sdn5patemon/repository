<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Absensi Perpustakaan</title>

  <!-- Library Scan Barcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }
    h2 {
      margin-top: 20px;
    }
    #reader {
      width: 300px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 10px;
    }
    #status {
      font-size: 18px;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Absensi Pengunjung Perpustakaan</h2>
<p>Silakan arahkan kamera ke barcode kartu siswa</p>

<!-- Area Kamera -->
<div id="reader"></div>

<!-- Status -->
<div id="status">Menunggu scan...</div>



<script>
  const statusEl = document.getElementById("status");

  function kirimData(idSiswa) {
  fetch("https://script.google.com/macros/s/AKfycbyywj4Ugc3AoHHNwestbo9PurbjqN7lvvlRicA0-lHIhWssuP9LGyIXG3KMdNnSwMAwlQ/exec", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "id=" + encodeURIComponent(idSiswa)
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "ok") {
      statusEl.innerHTML =
        "✅ Selamat datang<br>" +
        data.nama + " (" + data.kelas + ")";
    } else {
      statusEl.innerHTML = "❌ Data siswa tidak ditemukan";
    }
  })
  .catch(err => {
    statusEl.innerHTML = "❌ Gagal mengirim data";
    console.error(err);
  });
}


  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" }, // kamera belakang
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      if (sedangProses) return;
      sedangProses = true;

      html5QrCode.stop(); // stop agar tidak scan berulang
      kirimData(decodedText);

      // aktifkan scan lagi setelah 3 detik
      setTimeout(() => {
        statusEl.innerHTML = "Menunggu scan...";
        sedangProses = false;
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          arguments.callee
        );
      }, 3000);
    }
  );
</script>

</body>
</html>
