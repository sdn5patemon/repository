<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Pengunjung Perpustakaan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f4f6f8;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    table th {
      background: #f9fafb;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      background: #e0e7ff;
      color: #3730a3;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #6b7280;
    }

    .chart-wrapper {
        max-width: 600px;
        height: 300px;
        margin: auto;
    }

  </style>
</head>
<body>

<header>
  <h1>📚 Giri Widya LibSchool</h1>
  <p>Dashboard Pengunjung Perpustakaan</p>
</header>

<div class="container">

  <!-- Grafik -->
  <div class="card">
    <h2>Grafik Kunjungan (1 Bulan)</h2>
    <div class="chart-wrapper">
        <canvas id="chartKunjungan"></canvas>
      </div>
  </div>

  <!-- Tabel -->
  <div class="card">
    <h2>Daftar Pengunjung</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Kelas</th>
          <th>Tanggal</th>
          <th>Waktu</th>
        </tr>
      </thead>
      <tbody id="tabelPengunjung"></tbody>
    </table>
  </div>

</div>

<footer>
  © SD Negeri 5 Patemon
</footer>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbyywj4Ugc3AoHHNwestbo9PurbjqN7lvvlRicA0-lHIhWssuP9LGyIXG3KMdNnSwMAwlQ/exec";

  fetch(URL_API)
  .then(res => res.json())
  .then(data => {
    const tbody = document.getElementById('tabelPengunjung');
    const statistik = {};

    const hariIni = new Date();
    const batasTanggal = new Date();
    batasTanggal.setDate(hariIni.getDate() - 30);

    data.slice(1).forEach(row => {
      const [nama, kelas, tanggal, waktu] = row;

      const tglData = new Date(tanggal);

      // FILTER 1 BULAN TERAKHIR
      if (tglData >= batasTanggal) {

        // TABEL
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${nama}</td>
          <td><span class="badge">${kelas}</span></td>
          <td>${tanggal}</td>
          <td>${waktu}</td>
        `;
        tbody.appendChild(tr);

        // STATISTIK PER HARI
        statistik[tanggal] = (statistik[tanggal] || 0) + 1;
      }
    });

    // URUTKAN TANGGAL
    const labels = Object.keys(statistik).sort();
    const values = labels.map(tgl => statistik[tgl]);

    // GRAFIK
    new Chart(document.getElementById('chartKunjungan'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Jumlah Kunjungan (30 Hari Terakhir)',
          data: values
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  });

</script>

</body>
</html>
